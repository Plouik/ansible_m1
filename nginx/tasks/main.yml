---
# tasks file for nginx
- name: Ensure nginx is at the present version
  ansible.builtin.apt:
    name: nginx
    update_cache: true
    state: present

- name: Configure using custom configuration for {{ ansible_hostname }}
  ansible.builtin.template:
    dest: /etc/nginx/conf.d/default.conf
    src: "{{ ansible_hostname }}/nginx.conf.j2"
    owner: root
    group: root
    mode: "0644"
  when: '"templates/{{ inventory_hostname }}/nginx.conf.j2" is exists'
  notify: Reload nginx

- name: Configure using custom html for {{ ansible_hostname }}
  ansible.builtin.template:
    dest: /var/www/html/
    src: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ lookup('ansible.builtin.fileglob', 'templates/' + ansible_hostname + '/html/*', wantlist=True) }}"

- name: Supprimier le server nginx par default
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
  when: nginx_remove_default

- name: Ensure that nginx is started
  ansible.builtin.service:
    name: nginx
    state: started
